<style>

    color:var(--ink); background:#e9ebef;}
  canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;

  #bootBar{width:220px;height:3px;border-radius:3px;background:rgba(0,0,0,.10);overflow:hidden}
  #bootBar i{display:block;height:100%;width:40%;border-radius:3px;background:var(--accent);
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

  .panel{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid var(--line);border-radius:16px;

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const D2R=Math.PI/180;

const state={ mode:'full', labels:true, rotate:false,
  bay:false, gear:true, ab:false, surf:false, canopyOpen:false,
  bayT:0, gearT:1, abT:0, canT:0,
  selected:null, hovered:null };

/* ================= 渲染基础 ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(Math.max(320,innerWidth||1500),Math.max(240,innerHeight||900));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=makeBackgroundTexture();

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-15,7.5,-16);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=4; controls.maxDistance=90;
controls.maxPolarAngle=1.52;
controls.target.set(7.5,0.8,0);
controls.autoRotateSpeed=0.8;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

scene.add(new THREE.HemisphereLight(0xe3e9f2,0xc8ccd2,0.78));
const key=new THREE.DirectionalLight(0xfff3e6,2.35);
key.position.set(6,20,-15);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-14; key.shadow.camera.right=14;
key.shadow.camera.top=12;  key.shadow.camera.bottom=-8;
key.shadow.camera.near=1;  key.shadow.camera.far=60;
key.shadow.radius=6; key.shadow.bias=-0.0004;
scene.add(key);
const rim=new THREE.DirectionalLight(0xd8e6ff,1.15);
rim.position.set(-16,9,14); scene.add(rim);
const front=new THREE.DirectionalLight(0xfff0dd,0.8);
front.position.set(-8,4,-15); scene.add(front);
const fill=new THREE.DirectionalLight(0xffffff,0.22);
fill.position.set(0,-6,10); scene.add(fill);

/* 摄影台 */
{
  const cat=new THREE.Mesh(new THREE.CircleGeometry(26,72),new THREE.ShadowMaterial({opacity:0.22}));
  cat.rotation.x=-Math.PI/2; cat.position.y=-1.925; cat.receiveShadow=true; scene.add(cat);
  const plat=new THREE.Mesh(new THREE.CylinderGeometry(17,17.8,0.24,96),
    new THREE.MeshStandardMaterial({color:0x83888f,roughness:1.0,metalness:0.04,envMapIntensity:0.3}));
  plat.position.y=-2.055; plat.receiveShadow=true; scene.add(plat);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(17.1,0.02,8,140),
    new THREE.MeshBasicMaterial({color:0xb9bec7}));
  ring.rotation.x=Math.PI/2; ring.position.y=-1.915; scene.add(ring);
}

addEventListener('resize',()=>{
  const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

function makeBackgroundTexture(){
  const c=document.createElement('canvas'); c.width=32; c.height=512;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,'#eef0f4'); grd.addColorStop(0.55,'#e2e5ea'); grd.addColorStop(1,'#c3c7ce');
  g.fillStyle=grd; g.fillRect(0,0,32,512);
  const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}

/* ================= 蒙皮分缝线纹理(套装质感核心) ================= */
function skinTexture(w=1024,h=1024,dir='h'){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle='#969ca3'; g.fillRect(0,0,w,h);
  // 大块色斑
  for(let i=0;i<50;i++){
    g.fillStyle=`rgba(${Math.random()<0.5?'70,76,84':'220,226,232'},${0.03+Math.random()*0.04})`;
    g.fillRect(Math.random()*w,Math.random()*h,60+Math.random()*260,30+Math.random()*140);
  }
  const line=(x1,y1,x2,y2,alpha=0.55,lw=1.6)=>{
    g.strokeStyle=`rgba(96,102,110,${alpha})`; g.lineWidth=lw;
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  };
  // 长缝线
  const n=dir==='h'?10:14;
  for(let i=1;i<n;i++){
    const y=i*h/n+(Math.random()-0.5)*10;
    if(Math.random()<0.5) line(0,y,w,y,0.5);
  }
  for(let i=1;i<7;i++){
    const x=i*w/7+(Math.random()-0.5)*14;
    line(x,0,x,h,0.4);
  }
  // 锯齿缝线(F-35 标志性)×3 组
  for(let k=0;k<3;k++){
    const y0=h*(0.2+Math.random()*0.6);
    g.strokeStyle='rgba(96,102,110,0.6)'; g.lineWidth=1.7;
    g.beginPath();
    let x=Math.random()*w*0.4, y=y0, up=Math.random()<0.5;
    g.moveTo(x,y);
    for(let s=0;s<26;s++){
      x+=14+Math.random()*8; y+=up?-9:9; up=!up;
      g.lineTo(x,y);
    }
    g.stroke();
  }
  // 维护口盖
  for(let i=0;i<46;i++){
    const pw=30+Math.random()*90, ph=18+Math.random()*46;
    const px=Math.random()*(w-pw), py=Math.random()*(h-ph);
    g.fillStyle=Math.random()<0.5?'rgba(70,76,84,0.10)':'rgba(225,230,236,0.09)';
    g.fillRect(px,py,pw,ph);
    g.strokeStyle='rgba(90,96,104,0.65)'; g.lineWidth=1.6;
    g.strokeRect(px,py,pw,ph);
  }
  // 铆钉排
  for(let i=0;i<5;i++){
    const y=Math.random()*h;
    g.fillStyle='rgba(80,86,94,0.5)';
    for(let x=8;x<w-8;x+=11) g.fillRect(x,y,1.6,1.6);
  }
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace;
  tx.anisotropy=8; tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function turbineTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#212428'; g.fillRect(0,0,512,512);
  g.translate(256,256);
  for(let i=0;i<42;i++){
    g.rotate(Math.PI*2/42);
    g.fillStyle=i%2?'#3c4148':'#34383e';
    g.beginPath(); g.moveTo(0,-6); g.lineTo(238,-26); g.lineTo(238,26); g.lineTo(0,6); g.fill();
  }
  g.fillStyle='#191b1e'; g.beginPath(); g.arc(0,0,54,0,7); g.fill();
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=8;
  return tx;
}

/* ================= 材质体系 ================= */
const clipPlanes=[];
const partMats={};
function regPart(id,m){
  m.clippingPlanes=clipPlanes; m.clipShadows=true;
  m.userData.baseE={hex:m.emissive?m.emissive.getHex():0,i:m.emissiveIntensity??1};
  (partMats[id]??=[]).push(m); return m;
}
function M(id,params,opts={}){
  const m=new THREE.MeshPhysicalMaterial(Object.assign({side:THREE.DoubleSide},params));
  regPart(id,m); return m;
}
function setHL(id,level){
  const mats=partMats[id]; if(!mats)return;
  mats.forEach(m=>{
    if(!m.emissive)return;
    const b=m.userData.baseE;
    if(level===0){m.emissive.setHex(b.hex);m.emissiveIntensity=b.i;}
    else{m.emissive.setHex(0xff5a1e);m.emissiveIntensity=Math.max(b.i,0)+(level===2?0.30:0.12);}
  });
}

const fusTex=skinTexture(1024,1024,'h');
const wingTex=skinTexture(1024,512,'v');
const mSkin = M('skin',{color:0xffffff,map:fusTex,metalness:0.10,roughness:0.62,
  bumpMap:fusTex,bumpScale:0.5,clearcoat:0.25,clearcoatRoughness:0.5,envMapIntensity:1.5});
const mSkinD= M('skin',{color:0x9ba1a8,map:wingTex,metalness:0.10,roughness:0.66,
  bumpMap:wingTex,bumpScale:0.5,envMapIntensity:1.5});
const mNose = M('radome',{color:0x7e848c,metalness:0.3,roughness:0.5});
const mGlass= M('canopy',{color:0x6b5426,metalness:0.9,roughness:0.08,
  transparent:true,opacity:0.9,clearcoat:1.0,clearcoatRoughness:0.05,envMapIntensity:1.9});
const mDark = M('bay',{color:0x2b2e33,metalness:0.6,roughness:0.7});
const mMis  = M('missile',{color:0xdadde2,metalness:0.3,roughness:0.35});
const mNoz  = M('nozzle',{color:0x6f665c,metalness:0.9,roughness:0.42,
  emissive:0x883311,emissiveIntensity:0});
const mNozIn= M('nozzle',{color:0xa9adb2,metalness:0.9,roughness:0.35});
const mTire = M('gear',{color:0x24262a,metalness:0.2,roughness:0.85});
const mStrut= M('gear',{color:0xd6dade,metalness:0.9,roughness:0.3});
const mEots = M('eots',{color:0x23262a,metalness:0.7,roughness:0.25,clearcoat:0.8});
const mFin  = M('fin',{color:0x9ba1a8,metalness:0.05,roughness:0.75,
  emissive:0x3a3d42,emissiveIntensity:0.35});
const mSeat = M('canopy',{color:0x2e3136,metalness:0.4,roughness:0.6});
const mPilot= M('canopy',{color:0x4a4f38,metalness:0.2,roughness:0.7});

/* ================= 几何工具 ================= */
function loft(secs,ax){
  const S=secs.length,N=secs[0].pts.length;
  const pos=[],uv=[],idx=[];
  secs.forEach((sec,i)=>{
    sec.pts.forEach((p,j)=>{
      if(ax==='x')pos.push(sec.s,p[0],p[1]);
      else if(ax==='y')pos.push(p[0],sec.s,p[1]);
      else pos.push(p[0],p[1],sec.s);
      uv.push(i/(S-1),j/N);
    });
  });
  for(let i=0;i<S-1;i++)for(let j=0;j<N;j++){
    const a=i*N+j,b=i*N+(j+1)%N,c=(i+1)*N+(j+1)%N,d=(i+1)*N+j;
    idx.push(a,b,c,a,c,d);
  }
  function capCenter(si){
    let ca=0,cb=0;
    for(let j=0;j<N;j++){ca+=secs[si].pts[j][0];cb+=secs[si].pts[j][1];}
    if(ax==='x')pos.push(secs[si].s,ca/N,cb/N);
    else if(ax==='y')pos.push(ca/N,secs[si].s,cb/N);
    else pos.push(ca/N,cb/N,secs[si].s);
    uv.push(0.5,0.5);
    return S*N+(si===0?0:1);
  }
  const c0=capCenter(0),c1=capCenter(S-1);
  for(let j=0;j<N;j++){
    idx.push(c0,(j+1)%N,j);
    idx.push(c1,(S-1)*N+j,(S-1)*N+(j+1)%N);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function sect(w,hT,hB,nT,nB,cy=0,Np=44){
  const pts=[];
  for(let i=0;i<Np;i++){
    const a=i/Np*Math.PI*2,c=Math.cos(a),s=Math.sin(a);
    const h=c>=0?hT:hB, n=c>=0?nT:nB;
    pts.push([cy+h*Math.sign(c)*Math.pow(Math.abs(c),2/n),
              w*Math.sign(s)*Math.pow(Math.abs(s),2/n)]);
  }
  return pts;
}
function airfoilPts(chord,t,n=9){
  const pts=[];
  for(let i=0;i<=n;i++){
    const u=i/n;
    const y=(t*chord*0.5)*Math.pow(Math.sin(Math.PI*u),0.72)+0.012*chord*Math.sin(Math.PI*u);
    pts.push([-chord/2+u*chord,y]);
  }
  for(let i=n;i>=0;i--){
    const u=i/n;
    const y=(t*chord*0.5)*Math.pow(Math.sin(Math.PI*u),0.72)+0.006*chord*Math.sin(Math.PI*u);
    pts.push([-chord/2+u*chord,y]);
  }
  return pts;
}

  stab:{name:'全动平尾',en:'STABILATOR',

  missile:{name:'AIM-120 中距弹',en:'AIM-120 AMRAAM',
    desc:'主动雷达制导中距空空导弹,射程 100+ km,发射后不管。灰色弹体顶部的深色窗口是毫米波/红外引信。',
    specs:['射程 100+ km','M4','主动末制导'],
    tip:'弹头深色"鼻子"不是整流罩——那是 герметичный 引信天线罩,涂了透波涂层。'},
  nozzle:{name:'锯齿喷口',en:'SERRATED NOZZLE',
    desc:'F135 的收敛-扩散喷口:外圈 16 片棕钛色调节片边缘带锯齿,内圈是浅色密封片;深处可见涡轮盘。锯齿让尾流与冷空气掺混更快,红外特征和噪声双降。',
    specs:['16 外瓣+16 内瓣','棕钛涂层','涡轮盘可见'],
    tip:'每片外瓣的锯齿角度都不同——它们按喷流频率错开,声波互相抵消。'},
  gear:{name:'起落架',en:'LANDING GEAR',
    desc:'前起落架带转向与着陆灯、双撑杆;主起落架承受弹射/拦阻冲击(F-35C 型加强)。收放全程约 6 秒。',
    specs:['前三点式','前轮转向','着陆灯'],
    tip:'F-35 的起落架舱门本身就是锯齿边缘——收上后严丝合缝拼进蒙皮。'},
};

const FOCUS={
  f35:[[-15,7.5,-16],[7.5,0.8,0]],
  radome:[[7,3,-7],[2,0.3,0]],
  canopy:[[3.5,4.5,-6.5],[4.2,1.2,0]],
  intake:[[8.5,0.5,-7],[6.2,-0.2,-1.4]],
  eots:[[7,0.8,-4.5],[2.3,-1.1,0]],
  wing:[[14,3.5,-9],[8.6,0.2,-3]],
  stab:[[19,2.5,-5.5],[13,0.1,-1.6]],
  fin:[[19,5,-4.5],[13.2,2.2,-1.9]],
  bay:[[11,-5.5,-4],[8.3,-1.1,0]],
  missile:[[10.5,-4,-3],[8.1,-1.26,-0.5]],
  nozzle:[[21,1.5,0],[15,0.4,0]],
  gear:[[8.5,-3.5,-4.5],[6.2,-1.6,-0.5]],
};

const VIEWS={
  hero:[[-15,7.5,-16],[7.5,0.8,0]],
  front:[[-6,2.5,1],[5,0.6,0]],
  top:[[7.5,27,0.01],[7.5,0,0]],
  rear:[[25,4.5,4],[14,0.6,0]],
};

/* ================= UI ================= */
const toastEl=$('toast');let toastTimer=0;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600);}

let camTween=null;
function flyTo(pos,target,dur=1.0){
  camTween={t:0,dur,p0:camera.position.clone(),t0:controls.target.clone(),
    p1:V3(...pos),t1:V3(...target)};
}
controls.addEventListener('start',()=>{camTween=null;});
document.querySelectorAll('#grpView .btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#grpView .btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const v=VIEWS[b.dataset.view];flyTo(v[0],v[1]);
  });
});

const cutPlane=[new THREE.Plane(V3(0,0,-1),0)];
function setMode(m){
  state.mode=m;
  document.querySelectorAll('#grpMode .btn').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));
  clipPlanes.length=0;
  if(m==='cut')clipPlanes.push(...cutPlane);
  if(m==='cut')toast('剖面切视:沿纵轴线切开,看舱段布局');
}
document.querySelectorAll('#grpMode .btn').forEach(b=>{
  b.addEventListener('click',()=>setMode(b.dataset.mode));
});

function bindToggle(id,key,onTxt,offTxt,fn){
  const el=$(id);
  el.addEventListener('click',()=>{
    state[key]=!state[key];
    el.classList.toggle('on',state[key]);
    if(onTxt)el.textContent=state[key]?onTxt:offTxt;
    fn&&fn(state[key]);
  });
}
bindToggle('tgBay','bay','武器舱 关','武器舱 开',on=>{
  toast(on?'打开武器舱:4× AIM-120 就位':'关闭武器舱,恢复隐身外形');
});
bindToggle('tgGear','gear','起落架 收','起落架 放',on=>{
  toast(on?'收起落架:转入飞行状态':'放起落架:准备着陆');
});
bindToggle('tgCanopy','canopyOpen','座舱盖 关','座舱盖 开',on=>{
  toast(on?'座舱盖开启(后铰链):US16E 座椅可见':'座舱盖关闭');
});
bindToggle('tgSurf','surf');
bindToggle('tgLabels','labels');
bindToggle('tgRotate','rotate',null,null,on=>{controls.autoRotate=on;});

function setAB(on){
  state.ab=on;
  const b=$('btnAB');
  b.classList.toggle('on',on);
  b.textContent=on?'🔥 加力 ON':'🔥 加力 OFF';
  if(on)toast('加力接通:F135 推力 125 → 190 kN');
  else toast('加力断开');
}
$('btnAB').addEventListener('click',()=>setAB(!state.ab));
addEventListener('keydown',e=>{
  if(e.key==='b'||e.key==='B')$('tgBay').click();
  if(e.key==='g'||e.key==='G')$('tgGear').click();
  if(e.key==='a'||e.key==='A')$('btnAB').click();
  if(e.key==='l'||e.key==='L')$('tgLabels').click();
});

const infoEl=$('info');
function buildChips(){
  const wrap=$('infoChips');wrap.innerHTML='';
  Object.keys(PARTS).forEach(id=>{
    const c=document.createElement('span');
    c.className='chip';c.dataset.part=id;
    c.textContent=PARTS[id].name;
    c.addEventListener('click',()=>selectPart(id,true));
    wrap.appendChild(c);
  });
}
function renderInfo(partId){
  const P=PARTS[partId];if(!P)return;
  $('infoName').textContent=P.name;
  $('infoEn').textContent=P.en;
  $('infoSpecs').innerHTML=P.specs.map(s=>`<span>${s}</span>`).join('');
  $('infoDesc').textContent=P.desc;
  $('infoTip').style.display=P.tip?'block':'none';
  $('infoTip').textContent=P.tip||'';
  document.querySelectorAll('#infoChips .chip').forEach(c=>
    c.classList.toggle('on',c.dataset.part===partId));
}
function selectPart(partId,fly){
  if(state.selected&&state.selected!==partId)setHL(state.selected,0);
  state.selected=partId;setHL(partId,2);
  renderInfo(partId);
  infoEl.classList.add('show');
  if(fly&&FOCUS[partId])flyTo(FOCUS[partId][0],FOCUS[partId][1],0.9);
}
function deselect(){
  if(state.selected)setHL(state.selected,0);
  state.selected=null;
  infoEl.classList.remove('show');
  document.querySelectorAll('#infoChips .chip').forEach(c=>c.classList.remove('on'));
}
$('btnCloseInfo').addEventListener('click',deselect);
$('btnDeselect').addEventListener('click',deselect);
$('btnFocus').addEventListener('click',()=>{
  if(state.selected&&FOCUS[state.selected])flyTo(FOCUS[state.selected][0],FOCUS[state.selected][1]);
});
buildChips();renderInfo('f35');

const ray=new THREE.Raycaster();const ptr=new THREE.Vector2();
let ptrDown=false,ptrMoved=false;
renderer.domElement.style.cursor='grab';
renderer.domElement.addEventListener('pointerdown',()=>{ptrDown=true;ptrMoved=false;});
renderer.domElement.addEventListener('pointerup',()=>{ptrDown=false;});
renderer.domElement.addEventListener('pointermove',e=>{
  if(ptrDown)ptrMoved=true;
  ptr.x=(e.clientX/innerWidth)*2-1;
  ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  const part=hit?hit.object.userData.part:null;
  if(part!==state.hovered){
    if(state.hovered&&state.hovered!==state.selected)setHL(state.hovered,0);
    state.hovered=part;
    if(part&&part!==state.selected)setHL(part,1);
    renderer.domElement.style.cursor=part?'pointer':'grab';
  }
});
renderer.domElement.addEventListener('click',()=>{
  if(ptrMoved)return;
  if(state.hovered)selectPart(state.hovered,false);
  else deselect();
});
$('hintX').addEventListener('click',()=>$('hint').remove());
setTimeout(()=>{const h=$('hint');if(h){h.style.opacity='0';h.style.transition='opacity 1s';setTimeout(()=>h.remove(),1000);}},14000);

/* ================= 标注 ================= */
const LABEL_DEFS=[
  ['radome','雷达罩','radome',[0.7,0.32,0]],
  ['canopy','座舱盖','canopy',[4.2,1.4,0]],
  ['intake','DSI 进气道','intake',[6.0,-0.15,-1.7]],
  ['eots','EOTS','eots',[2.3,-1.0,0]],
  ['wing','机翼 · AIM-9X','wing',[9.4,0,-5.3]],
  ['stab','全动平尾','stab',[13.2,-0.1,-2.4]],
  ['fin','外倾垂尾','fin',[13.4,2.9,-2.3]],
  ['bay','内置弹舱','bay',[8.35,-1.15,0.6]],
  ['nozzle','锯齿喷口','nozzle',[15.2,0.5,0]],
  ['gear','起落架','gear',[4.05,-1.9,0]],
];
const labelAnchors=[];
{
  const wrap=$('labels');
  LABEL_DEFS.forEach(([part,text,modKey,p])=>{
    const anchor=new THREE.Object3D();anchor.position.set(...p);
    jet.add(anchor);
    const el=document.createElement('div');
    el.className='lab';el.textContent=text;
    el.addEventListener('click',()=>selectPart(part,true));
    wrap.appendChild(el);
    labelAnchors.push({part,anchor,el});
  });
}
const _lv=new THREE.Vector3();
function updateLabels(){
  labelAnchors.forEach(L=>{
    L.anchor.getWorldPosition(_lv);_lv.project(camera);
    const off=_lv.z>1||_lv.z<-1;
    const vis=state.labels&&!off;
    L.el.style.display=vis?'block':'none';
    if(!vis)return;
    L.el.style.left=((_lv.x*0.5+0.5)*innerWidth)+'px';
    L.el.style.top=((-_lv.y*0.5+0.5)*innerHeight)+'px';
    L.el.classList.toggle('on',state.selected===L.part);
    L.el.classList.toggle('dim',!!state.selected&&state.selected!==L.part);
  });
}

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let hudTimer=0,booted=false;

function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  /* 画布自愈 */
  if(renderer.domElement.width<2){
    const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
    camera.aspect=w/h;camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }

  state.bayT+=((state.bay?1:0)-state.bayT)*Math.min(1,dt*2.2);
  state.gearT+=((state.gear?1:0)-state.gearT)*Math.min(1,dt*1.4);
  state.abT+=((state.ab?1:0)-state.abT)*Math.min(1,dt*1.8);
  state.canT+=((state.canopyOpen?1:0)-state.canT)*Math.min(1,dt*2.0);

  bayDoors.forEach(({pivot,sgn})=>{ pivot.rotation.x=sgn*state.bayT*70*D2R; });
  /* 关舱时隐藏舱内物(舱门本体保持可见) */
  const bayInnerVisible=state.bayT>0.04;
  jet.traverse(o=>{
    if(o.isMesh&&o.userData.bayInner)o.visible=bayInnerVisible;
  });
  gearPivots.forEach(({p,dir})=>{
    p.rotation.z=dir*(1-state.gearT)*1.5;
    p.visible=state.gearT>0.02;
  });
  canopyPivot.rotation.z=state.canT*38*D2R;

  plumeMats.forEach((m,i)=>{
    m.opacity=state.abT*(i===0?0.62:0.5)*(0.9+0.1*Math.sin(t*37+i*3));
  });
  mNoz.emissiveIntensity=state.abT*0.8;

  const wig=state.surf?1:0;
  const sway=Math.sin(t*1.7);
  stabGroups.forEach(({g,sgn})=>{ g.rotation.z=lerp(g.rotation.z,sway*4*D2R*sgn*wig,0.1); });
  finGroups.forEach(({g,sgn})=>{ g.rotation.y=lerp(g.rotation.y,sway*6*D2R*sgn*wig,0.1); });

  if(camTween){
    camTween.t+=dt/camTween.dur;
    const k=camTween.t>=1?1:(camTween.t<0.5?4*camTween.t**3:1-Math.pow(-2*camTween.t+2,3)/2);
    camera.position.lerpVectors(camTween.p0,camTween.p1,k);
    controls.target.lerpVectors(camTween.t0,camTween.t1,k);
    if(camTween.t>=1)camTween=null;
  }
  controls.update();
  updateLabels();

  hudTimer+=dt;
  if(hudTimer>0.15){
    hudTimer=0;
    $('thrv').textContent=(125+65*state.abT).toFixed(0);
    $('modev').textContent=state.ab?'加力':(state.gear?'地面':'空中');
  }

  renderer.render(scene,camera);

  if(!booted){
    booted=true;
    setTimeout(()=>{$('boot').classList.add('hide');
      setTimeout(()=>flyTo(VIEWS.hero[0],VIEWS.hero[1],1.6),80);},350);
  }
}

/* ================= 启动 ================= */
setMode('full');
renderer.setAnimationLoop(loop);
window.__step=n=>{for(let i=0;i<n;i++)loop();};
window.__shot=()=>renderer.domElement.toDataURL('image/png');
window.__view=(p,t)=>{camera.position.set(...p);controls.target.set(...t);camTween=null;};
window.__set=k=>{Object.assign(state,k);};
window.__dbg={scene,renderer,camera,controls,jet,state};
</script>

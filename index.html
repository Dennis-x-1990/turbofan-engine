<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>涡喷发动机 J85 · 交互式3D解剖 | Turbojet Ultra</title>
<style>
  :root{
    --ink:#191d22; --ink2:#4a515b; --line:rgba(20,26,34,.10);
    --panel:rgba(255,255,255,.72); --accent:#ff6a2a; --blue:#2563eb;
    --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); background:#e9ebef;}
  canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(28,34,44,.16) 100%);}
  #boot{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#f2f4f8,#d8dbe1);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .7s ease;letter-spacing:.08em}
  #boot.hide{opacity:0;pointer-events:none}
  #boot .t{font-size:22px;font-weight:700;letter-spacing:.3em;color:#22262c}
  #boot .s{font-size:12px;color:#69707b;letter-spacing:.2em}
  #bootBar{width:220px;height:3px;border-radius:3px;background:rgba(0,0,0,.10);overflow:hidden}
  #bootBar i{display:block;height:100%;width:40%;border-radius:3px;background:var(--accent);
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  .panel{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 10px 30px rgba(25,32,44,.10),0 1px 0 rgba(255,255,255,.7) inset}
  #hudTitle{position:fixed;top:18px;left:20px;z-index:10;padding:14px 18px 12px;max-width:340px}
  #hudTitle .en{font-size:11px;letter-spacing:.30em;color:#8a919c;font-weight:600}
  #hudTitle h1{font-size:19px;font-weight:800;margin:2px 0 4px}
  #hudTitle h1 b{color:var(--accent)}
  #hudTitle .sub{font-size:11.5px;color:var(--ink2);line-height:1.6}
  #stats{position:fixed;top:18px;right:20px;z-index:10;display:flex;gap:8px;padding:10px 12px}
  .gauge{min-width:72px;text-align:center}
  .gauge .k{font-size:10px;letter-spacing:.12em;color:#8a919c;font-weight:600}
  .gauge .v{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:2px}
  .gauge .u{font-size:9.5px;color:#9aa1ac;margin-left:2px}
  .gauge.hot .v{color:#e2431f}
  .gauge.pow .v{color:var(--blue)}
  #dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    display:flex;flex-direction:column;gap:8px;padding:12px 14px;min-width:640px}
  .dockRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
  .grp{display:flex;gap:4px;background:rgba(20,26,34,.05);border-radius:11px;padding:3px}
  .btn{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12px;font-weight:600;
    padding:7px 12px;border-radius:9px;cursor:pointer;letter-spacing:.04em;white-space:nowrap;transition:all .18s}
  .btn:hover{color:var(--ink);background:rgba(255,255,255,.75)}
  .btn.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(25,32,44,.14)}
  .btn.ab{background:#3b2a18;color:#ffd9a8;font-weight:800;border:1px solid rgba(255,150,50,.4)}
  .btn.ab.on{background:linear-gradient(90deg,#ff6a2a,#ffb340);color:#fff;
    box-shadow:0 0 18px rgba(255,140,40,.7);animation:abPulse 1s infinite}
  @keyframes abPulse{50%{box-shadow:0 0 30px rgba(255,160,60,.9)}}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .sl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);font-weight:600}
  .sl .lab{letter-spacing:.1em;white-space:nowrap}
  .sl output{font-family:var(--mono);font-size:11px;min-width:40px;color:var(--ink)}
  input[type=range]{-webkit-appearance:none;width:110px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent) var(--p,40%),rgba(20,26,34,.14) var(--p,40%));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:grab}
  #info{position:fixed;top:86px;right:20px;z-index:10;width:308px;max-height:calc(100% - 200px);
    overflow:auto;padding:16px 18px;transform:translateX(360px);opacity:0;transition:all .35s cubic-bezier(.2,.8,.2,1)}
  #info.show{transform:none;opacity:1}
  #info::-webkit-scrollbar{width:4px}
  #info::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px}
  #infoChips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
  .chip{font-size:10.5px;padding:4px 8px;border-radius:7px;background:rgba(20,26,34,.06);
    color:var(--ink2);cursor:pointer;white-space:nowrap}
  .chip:hover{background:#fff;color:var(--ink)}
  .chip.on{background:var(--accent);color:#fff}
  #infoName{font-size:18px;font-weight:800}
  #infoEn{font-size:11px;letter-spacing:.18em;color:#8a919c;margin:2px 0 10px}
  #infoSpecs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  #infoSpecs span{font-size:10.5px;font-family:var(--mono);background:rgba(37,99,235,.08);
    color:#2456b8;padding:4px 8px;border-radius:7px}
  #infoDesc{font-size:12.5px;line-height:1.85;color:#333a44}
  #infoTip{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,106,42,.07);
    border:1px solid rgba(255,106,42,.18);font-size:11.5px;line-height:1.75;color:#8c4a1f}
  #infoTip::before{content:"◈ 小知识  ";font-weight:800;color:var(--accent)}
  #infoBtns{display:flex;gap:8px;margin-top:12px}
  #infoBtns .btn{background:rgba(20,26,34,.06);border-radius:9px}
  #btnCloseInfo{position:absolute;top:10px;right:12px;font-size:14px;color:#9aa1ac;padding:4px 8px}
  #labels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
    font-size:11px;font-weight:600;color:#2a2f37;background:rgba(255,255,255,.82);
    border:1px solid rgba(20,26,34,.12);padding:3px 9px;border-radius:20px;white-space:nowrap;
    box-shadow:0 3px 10px rgba(25,32,44,.12);backdrop-filter:blur(6px)}
  .lab:hover,.lab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lab.dim{opacity:.35}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);z-index:20;
    padding:9px 18px;font-size:12px;font-weight:600;color:#fff;background:rgba(24,28,34,.88);
    border-radius:24px;opacity:0;pointer-events:none;transition:all .3s}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #hint{position:fixed;left:20px;bottom:16px;z-index:9;padding:10px 16px;font-size:11.5px;
    color:var(--ink2)}
  #hint b{color:var(--ink)}
  @media (max-width:900px){
    #dock{min-width:0;width:calc(100% - 16px)}
    #info{width:280px}
    #hudTitle{max-width:250px}
  }
</style>

{
  "imports": {

  <div class="t">TURBOJET&nbsp;J85</div>

<script type="importmap">

  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const D2R=Math.PI/180;

const state={ mode:'full', labels:true, rotate:false, flow:false, ab:false,
  thr:0.40, thrT:0.40, abT:0, n1:0,
  selected:null, hovered:null };

/* ================= 渲染基础 ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(Math.max(320,innerWidth||1500),Math.max(240,innerHeight||900));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
renderer.localClippingEnabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=makeBackgroundTexture();

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.05,80);
camera.position.set(-3.2,1.4,-3.0);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=0.5; controls.maxDistance=18;
controls.maxPolarAngle=1.53;
controls.target.set(0,0,0);
controls.autoRotateSpeed=0.8;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

scene.add(new THREE.HemisphereLight(0xe3e9f2,0xc8ccd2,0.62));
const key=new THREE.DirectionalLight(0xfff3e6,2.0);
key.position.set(2.5,3.2,-2.0);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-3; key.shadow.camera.right=3;
key.shadow.camera.top=2.4; key.shadow.camera.bottom=-1.6;
key.shadow.camera.near=0.5; key.shadow.camera.far=12;
key.shadow.radius=6; key.shadow.bias=-0.0004;
scene.add(key);
const rim=new THREE.DirectionalLight(0xd8e6ff,1.05);
rim.position.set(-3,1.6,2.4); scene.add(rim);
const front=new THREE.DirectionalLight(0xfff0dd,0.65);
front.position.set(-1.5,0.8,-3); scene.add(front);
const fill=new THREE.DirectionalLight(0xffffff,0.2);
fill.position.set(0,-1.6,2.4); scene.add(fill);

/* 摄影台 */
{
  const cat=new THREE.Mesh(new THREE.CircleGeometry(6,72),new THREE.ShadowMaterial({opacity:0.22}));
  cat.rotation.x=-Math.PI/2; cat.position.y=-0.62; cat.receiveShadow=true; scene.add(cat);
  const plat=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.75,0.14,96),
    new THREE.MeshStandardMaterial({color:0x83888f,roughness:1.0,metalness:0.04,envMapIntensity:0.3}));
  plat.position.y=-0.69; plat.receiveShadow=true; scene.add(plat);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.62,0.012,8,140),
    new THREE.MeshBasicMaterial({color:0xb9bec7}));
  ring.rotation.x=Math.PI/2; ring.position.y=-0.615; scene.add(ring);
}

addEventListener('resize',()=>{
  const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

function makeBackgroundTexture(){
  const c=document.createElement('canvas'); c.width=32; c.height=512;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,'#eef0f4'); grd.addColorStop(0.55,'#e2e5ea'); grd.addColorStop(1,'#c3c7ce');
  g.fillStyle=grd; g.fillRect(0,0,32,512);
  const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}

/* ================= 程序化纹理 ================= */
function skinTexture(w=1024,h=512){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle='#82878e'; g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){
    g.fillStyle=`rgba(${Math.random()<0.5?'56,62,70':'190,196,203'},${0.04+Math.random()*0.05})`;
    g.fillRect(Math.random()*w,Math.random()*h,60+Math.random()*220,26+Math.random()*110);
  }
  const line=(x1,y1,x2,y2,a=0.55,lw=1.6)=>{
    g.strokeStyle=`rgba(66,72,80,${a})`; g.lineWidth=lw;
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  };
  for(let i=1;i<8;i++){ const y=i*h/8+(Math.random()-0.5)*14;
    line(0,y,w,y,0.6); }
  for(let i=1;i<5;i++){ const x=i*w/5+(Math.random()-0.5)*16;
    line(x,0,x,h,0.45); }
  for(let i=0;i<26;i++){
    const pw=36+Math.random()*80, ph=16+Math.random()*40;
    const px=Math.random()*(w-pw), py=Math.random()*(h-ph);
    g.fillStyle=Math.random()<0.5?'rgba(58,64,72,0.10)':'rgba(200,206,213,0.08)';
    g.fillRect(px,py,pw,ph);
    g.strokeStyle='rgba(74,80,88,0.6)'; g.lineWidth=1.4;
    g.strokeRect(px,py,pw,ph);
  }
  for(let i=0;i<6;i++){
    const y=Math.random()*h;
    g.fillStyle='rgba(70,76,84,0.5)';
    for(let x=8;x<w-8;x+=10) g.fillRect(x,y,1.5,1.5);
  }
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=8;
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function turbineTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#1e2124'; g.fillRect(0,0,512,512);
  g.translate(256,256);
  for(let i=0;i<40;i++){
    g.rotate(Math.PI*2/40);
    g.fillStyle=i%2?'#3c4148':'#34383e';
    g.beginPath(); g.moveTo(0,-8); g.lineTo(240,-28); g.lineTo(240,28); g.lineTo(0,8); g.fill();
  }
  g.fillStyle='#16181b'; g.beginPath(); g.arc(0,0,56,0,7); g.fill();
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=8;
  return tx;
}
function screechTexture(){
  const c=document.createElement('canvas'); c.width=512; c.height=128;
  const g=c.getContext('2d');
  g.fillStyle='#43474d'; g.fillRect(0,0,512,128);
  g.fillStyle='rgba(20,22,25,0.85)';
  for(let y=10;y<128;y+=14)for(let x=6;x<512;x+=12){
    g.beginPath(); g.arc(x+(y%28?6:0),y,2.6,0,7); g.fill();
  }
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace; tx.wrapS=THREE.RepeatWrapping;
  return tx;
}
function plumeTexture(){
  const c=document.createElement('canvas'); c.width=8; c.height=256;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,256,0,0);
  grd.addColorStop(0,'rgba(255,255,255,0.9)');
  grd.addColorStop(0.3,'rgba(255,255,255,0.5)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,8,256);
  return new THREE.CanvasTexture(c);
}

/* ================= 材质体系 ================= */
const clipPlanes=[];
const partMats={};
function regPart(id,m){
  m.clippingPlanes=clipPlanes; m.clipShadows=true;
  m.userData.baseE={hex:m.emissive?m.emissive.getHex():0,i:m.emissiveIntensity??1};
  (partMats[id]??=[]).push(m); return m;
}
function M(id,params,opts={}){
  const m=new THREE.MeshPhysicalMaterial(Object.assign({side:THREE.DoubleSide},params));
  regPart(id,m); return m;
}
function setHL(id,level){
  const mats=partMats[id]; if(!mats)return;
  mats.forEach(m=>{
    if(!m.emissive)return;
    const b=m.userData.baseE;
    if(level===0){m.emissive.setHex(b.hex);m.emissiveIntensity=b.i;}
    else{m.emissive.setHex(0xff5a1e);m.emissiveIntensity=Math.max(b.i,0)+(level===2?0.30:0.12);}
  });
}

const caseTex=skinTexture(1024,512);
const mCase  = M('case',{color:0xd6dade,map:caseTex,metalness:0.28,roughness:0.5,
  bumpMap:caseTex,bumpScale:0.4,envMapIntensity:1.1});
const mCaseIn= M('case',{color:0x8b9096,metalness:0.4,roughness:0.45});
const mTi    = M('comp',{color:0xc4ccd4,metalness:0.85,roughness:0.32});
const mTiS   = M('comp',{color:0x9aa1a9,metalness:0.8,roughness:0.38});
const mHotS  = M('turbine',{color:0x74797f,metalness:0.85,roughness:0.4});
const mHotR  = M('turbine',{color:0x8b8f95,metalness:0.85,roughness:0.36});
const mLiner = M('combustor',{color:0x585c62,metalness:0.85,roughness:0.5,
  emissive:0xff4d12,emissiveIntensity:0});
const mNoz   = M('nozzle',{color:0x6a6156,metalness:0.88,roughness:0.42,

/* ================= 几何工具 ================= */
function latheZ(pts,seg=96){ const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg); g.rotateZ(-Math.PI/2); return g; }
function cylZ(r,len,seg=48,open=false){ const g=new THREE.CylinderGeometry(r,r,len,seg,1,open); g.rotateZ(-Math.PI/2); return g; }
function torusZ(r,t){ const g=new THREE.TorusGeometry(r,t,10,96); g.rotateY(Math.PI/2); return g; }
function airfoilPts(chord,tc,n=9){
  const pts=[], t=chord*tc;
  for(let i=0;i<=n;i++){
    const u=i/n;
    const y=t*0.5*Math.pow(Math.sin(Math.PI*u),0.75)-0.10*t*Math.sin(Math.PI*u)+0.06*t*u;
    pts.push([-chord/2+u*chord,y]);
  }
  for(let i=n;i>=0;i--){
    const u=i/n;
    const y=-t*0.35*Math.pow(Math.sin(Math.PI*u),0.9)-0.06*t*Math.sin(Math.PI*u)-0.06*t*u;
    pts.push([-chord/2+u*chord,y]);
  }
  return pts;
}
function bladeRing(o){
  const S=o.segs??8, Np=o.chordPts??12, L=2*Np;
  const pos=[], idx=[];
  for(let j=0;j<=S;j++){
    const t=j/S;
    const chord=lerp(o.c0,o.c1,t);
    const tw=lerp(o.tw0,o.tw1,t);
    const th=lerp(o.th??0.10,(o.th1??(o.th??0.10)*0.72),t);
    for(let i=0;i<L;i++){
      const upper=i<Np;
      const k=upper? i/(Np-1) : 1-(i-Np)/(Np-1);
      const u=k-0.5;
      const prof=Math.sqrt(Math.max(0,1-Math.pow(Math.abs(2*u),2.6)));
      const yh=th*chord*0.5*(0.12+0.88*prof);
      const cb=-(o.flip??1)*(o.cam??0.10)*chord*Math.sin(Math.PI*(u+0.5));
      let x=u*chord, z=cb+(upper?yh:-yh);
      const ct=Math.cos(tw), st=Math.sin(tw);
      pos.push(x*ct+z*st, o.r0+t*o.span, -x*st+z*ct);
    }
  }
  for(let j=0;j<S;j++)for(let i=0;i<L;i++){
    const a=j*L+i,b=j*L+(i+1)%L,c=(j+1)*L+(i+1)%L,d=(j+1)*L+i;
    idx.push(a,b,c,a,c,d);
  }
  const base=L*S; let cx=0,cy=0,cz=0;
  for(let i=0;i<L;i++){const p=(base-L+i)*3;cx+=pos[p];cy+=pos[p+1];cz+=pos[p+2];}
  pos.push(cx/L,cy/L,cz/L);
  for(let i=0;i<L;i++){const a=base-L+i,b=base-L+(i+1)%L; idx.push(base,a,b);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function bladeRingMesh(o){
  const m=new THREE.InstancedMesh(bladeGeo2(o),o.mat,o.count);
  const M4=new THREE.Matrix4();
  for(let i=0;i<o.count;i++){
    M4.makeRotationX(i/o.count*Math.PI*2+(o.phase??0));
    m.setMatrixAt(i,M4);
  }
  m.frustumCulled=false; m.castShadow=true;
  return m;
}
function bladeGeo2(o){
  const S=o.segs??8, Np=o.chordPts??12, L=2*Np;
  const pos=[], idx=[];
  for(let j=0;j<=S;j++){
    const t=j/S;
    const chord=lerp(o.c0,o.c1,t);
    const tw=lerp(o.tw0,o.tw1,t);
    const th=lerp(o.th??0.10,(o.th1??(o.th??0.10)*0.72),t);
    for(let i=0;i<L;i++){
      const upper=i<Np;
      const k=upper? i/(Np-1) : 1-(i-Np)/(Np-1);
      const u=k-0.5;
      const prof=Math.sqrt(Math.max(0,1-Math.pow(Math.abs(2*u),2.6)));
      const yh=th*chord*0.5*(0.12+0.88*prof);
      const cb=-(o.flip??1)*(o.cam??0.10)*chord*Math.sin(Math.PI*(u+0.5));
      let x=u*chord, z=cb+(upper?yh:-yh);
      const ct=Math.cos(tw), st=Math.sin(tw);
      pos.push((o.x??0)+x*ct+z*st, o.r0+t*o.span, -x*st+z*ct);
    }
  }
  for(let j=0;j<S;j++)for(let i=0;i<L;i++){
    const a=j*L+i,b=j*L+(i+1)%L,c=(j+1)*L+(i+1)%L,d=(j+1)*L+i;
    idx.push(a,b,c,a,c,d);
  }
  const base=L*S; let cx=0,cy=0,cz=0;
  for(let i=0;i<L;i++){const p=(base-L+i)*3;cx+=pos[p];cy+=pos[p+1];cz+=pos[p+2];}
  pos.push(cx/L,cy/L,cz/L);
  for(let i=0;i<L;i++){const a=base-L+i,b=base-L+(i+1)%L; idx.push(base,a,b);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const FLOW_KEYS=[
  {x:1.75,r0:0.14,r1:0.24,sp:0.5,sw:0},

];
const flowStreaks=[];
{
  const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),
    (()=>{const m=new THREE.MeshBasicMaterial({transparent:true,opacity:0,
      blending:THREE.NormalBlending,depthWrite:false,toneMapped:false});
      m.clippingPlanes=clipPlanes;return m;})(),380);
  im.frustumCulled=false; obj.add(im);
  flowStreaks.im=im;
  for(let i=0;i<380;i++)flowStreaks.push({s:Math.random(),u:Math.random(),
    th:Math.random()*Math.PI*2,v:0.6+Math.random()*0.8});
}
function ramp(stops){
  const lut=stops.map(s=>new THREE.Color(s[1]));
  return t=>{
    const x=clamp(t,0,1)*(stops.length-1),k=Math.min(stops.length-2,Math.floor(x)),f=x-k;
    return lut[k].clone().lerp(lut[k+1],f);
  };
}
const coreRamp=ramp([[0,0x9cc4ff],[0.14,0xcfe0ff],[0.26,0xeef3ff],[0.36,0xffb066],
  [0.48,0xff8a3c],[0.66,0xff6a2a],[0.82,0xffc890],[1,0xfff0dd]]);
function sampleFlow(s,u,out){
  const K=FLOW_KEYS.length,f=clamp(s,0,1)*(K-1),i=Math.min(K-2,Math.floor(f)),t=f-i;
  const a=FLOW_KEYS[i],b=FLOW_KEYS[i+1];
  out.x=lerp(a.x,b.x,t);
  out.r=lerp(lerp(a.r0,a.r1,u),lerp(b.r0,b.r1,u),t);
  out.sp=lerp(a.sp,b.sp,t);
  out.sw=lerp(a.sw,b.sw,t);
  const xn=(i<K-1?FLOW_KEYS[i+1].x:a.x), xp=(i>0?FLOW_KEYS[i-1].x:a.x);
  out.dx=(xn-xp)*0.5;
  out.dr=lerp(b.r0-a.r0, a.r1-b.r1, t)*0.5;
}
function updateFlow(dt,speed,ab){
  const im=flowStreaks.im;
  for(let i=0;i<flowStreaks.length;i++){
    const p=flowStreaks[i];
    p.s+=dt*speed*p.v;
    if(p.s>=1){p.s-=1;p.u=Math.random();p.th=Math.random()*Math.PI*2;}
    sampleFlow(p.s,p.u,_sp2);
    const th=p.th+_sp2.sw*p.v;
    _f.position.set(_sp2.x,_sp2.r*Math.cos(th),_sp2.r*Math.sin(th));
    _f.rotation.set(th*0.2,0,0);
    _f.scale.set((0.06+0.05*_sp2.sp)*(0.7+p.v*0.6),0.012,0.012);
    _f.updateMatrix();
    im.setMatrixAt(i,_f.matrix);
    _c2.copy(coreRamp(p.s));
    if(p.s>0.72)_c2.lerp(new THREE.Color(0xfff0dd),ab*0.85);
    if(p.s<0.02)_c2.multiplyScalar(p.s/0.02*0.8+0.2);
    im.setColorAt(i,_c2);
  }
  im.instanceMatrix.needsUpdate=true;
  if(im.instanceColor)im.instanceColor.needsUpdate=true;
}
const _sp2={};

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let hudTimer=0,booted=false;
const _f=new THREE.Object3D(),_qz2=new THREE.Quaternion(),_qy2=new THREE.Quaternion();
const AXZ=V3(0,0,1),AYY=V3(0,1,0),_c2=new THREE.Color();

function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  /* 画布自愈 */
  if(renderer.domElement.width<2){
    const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
    camera.aspect=w/h;camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }

  state.thrT+=(state.thr-state.thrT)*Math.min(1,dt*1.2);
  state.abT+=((state.ab?1:0)-state.abT)*Math.min(1,dt*1.6);
  const thr=state.thrT, ab=state.abT;

  /* N1 惯性 + 转子旋转 */
  const n1Tgt=0.2+0.8*thr;
  state.n1+=(n1Tgt-state.n1)*Math.min(1,dt*0.55);
  mSpool.rotation.x+=state.n1*55*dt;

  /* 燃烧室发光 */
  const fire=state.n1*clamp(state.n1*1.5,0,1);
  mLiner.emissiveIntensity=fire*1.35;
  mNoz.emissiveIntensity=thr*0.35+ab*0.5;

  /* 喷口花瓣:干态收小,加力张开 */
  const petalOpen=lerp(0.2,1.0,ab);
  const rIn=0.235, rOut=lerp(0.155,0.185,petalOpen);
  const xIn=-1.19, xOut=lerp(-1.40,-1.47,petalOpen);
  nozPivots.forEach((p,i)=>{
    const ph=(i%2)?0.06:0;
    p.position.x=-1.21-0.07*petalOpen-ph;
    p.scale.set(1,1+0.14*petalOpen,1+0.14*petalOpen);
  });
  /* 尾焰 + 激波菱形 */
  plumeMats.forEach((m,i)=>{
    m.opacity=(0.10*thr+ab*0.72)*(i===0?1:0.55)*(0.9+0.1*Math.sin(t*30+i*3));
  });
  diamonds.forEach((dm,i)=>{
    const k=(t*0.5+i/diamonds.length)%1;
    dm.position.x=-1.5-k*(1.2+ab*1.2);
    const s=lerp(0.13,0.08,k)*(0.8+ab*0.7);
    dm.scale.setScalar(s);
    dm.material.opacity=(0.06+ab*0.6)*(1-k*0.75);
  });

  /* 气流 */
  flowStreaks.im.visible=state.flow;
  if(state.flow){
    flowStreaks.im.material.opacity=clamp(0.2+0.75*state.n1,0,0.95);
    updateFlow(dt,0.3+1.3*state.n1,ab);
  }

  /* 相机补间 */
  if(camTween){
    camTween.t+=dt/camTween.dur;
    const k=camTween.t>=1?1:(camTween.t<0.5?4*camTween.t**3:1-Math.pow(-2*camTween.t+2,3)/2);
    camera.position.lerpVectors(camTween.p0,camTween.p1,k);
    controls.target.lerpVectors(camTween.t0,camTween.t1,k);
    if(camTween.t>=1)camTween=null;
  }
  controls.update();
  updateLabels();

  hudTimer+=dt;
  if(hudTimer>0.15){
    hudTimer=0;
    $('n1v').textContent=Math.round(state.n1*100);
    const dry=15.7*Math.pow(state.n1,1.85);
    $('thrv').textContent=(dry+ab*6.6*Math.pow(state.n1,2)).toFixed(1);
    $('egtv').textContent=Math.round(20+520*state.n1*(0.4+0.6*thr)+ab*750);
    $('modev').textContent=ab>0.5?'加力':'干态';
  }

  renderer.render(scene,camera);

  if(!booted){
    booted=true;
    setTimeout(()=>{$('boot').classList.add('hide');
      setTimeout(()=>flyTo(VIEWS.hero[0],VIEWS.hero[1],1.6),80);},350);
  }
}

/* ================= 启动 ================= */
renderer.setAnimationLoop(loop);
window.__step=n=>{for(let i=0;i<n;i++)loop();};
window.__shot=()=>renderer.domElement.toDataURL('image/png');
window.__view=(p,t)=>{camera.position.set(...p);controls.target.set(...t);camTween=null;};
window.__set=k=>{Object.assign(state,k);};
window.__dbg={scene,renderer,camera,controls,obj,state};
</script>
</body>
</html>

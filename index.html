<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const D2R=Math.PI/180;

const state={ mode:'full', labels:true, rotate:false,
  bay:false, gear:true, surf:false, thr:0.35,
  bayT:0, gearT:1, thrT:0.35,
  selected:null, hovered:null };

/* ================= 渲染基础 ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(Math.max(320,innerWidth||1500),Math.max(240,innerHeight||900));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.52;
renderer.localClippingEnabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=makeBackgroundTexture();

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,500);
camera.position.set(-30,17,-31);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=6; controls.maxDistance=140;
controls.maxPolarAngle=1.52;
controls.target.set(0,0.5,0);
controls.autoRotateSpeed=0.8;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

scene.add(new THREE.HemisphereLight(0xe3e9f2,0xc8ccd2,0.7));
const key=new THREE.DirectionalLight(0xfff3e6,1.9);
key.position.set(16,30,-18);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-34; key.shadow.camera.right=34;
key.shadow.camera.top=30;  key.shadow.camera.bottom=-26;
key.shadow.camera.near=1;  key.shadow.camera.far=110;
key.shadow.radius=6; key.shadow.bias=-0.0004;
scene.add(key);
const rim=new THREE.DirectionalLight(0xd8e6ff,1.15);
rim.position.set(-28,14,26); scene.add(rim);
const front=new THREE.DirectionalLight(0xfff0dd,0.75);
front.position.set(-14,7,-28); scene.add(front);
const fill=new THREE.DirectionalLight(0xffffff,0.22);
fill.position.set(0,-10,16); scene.add(fill);

/* 摄影台 */
{
  const cat=new THREE.Mesh(new THREE.CircleGeometry(40,80),new THREE.ShadowMaterial({opacity:0.22}));
  cat.rotation.x=-Math.PI/2; cat.position.y=-1.925; cat.receiveShadow=true; scene.add(cat);
  const plat=new THREE.Mesh(new THREE.CylinderGeometry(31,32,0.24,96),
    new THREE.MeshStandardMaterial({color:0x83888f,roughness:1.0,metalness:0.04,envMapIntensity:0.3}));
  plat.position.y=-2.055; plat.receiveShadow=true; scene.add(plat);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(31.1,0.025,8,140),
    new THREE.MeshBasicMaterial({color:0xb9bec7}));
  ring.rotation.x=Math.PI/2; ring.position.y=-1.915; scene.add(ring);
}

addEventListener('resize',()=>{
  const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

function makeBackgroundTexture(){
  const c=document.createElement('canvas'); c.width=32; c.height=512;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,'#eef0f4'); grd.addColorStop(0.55,'#e2e5ea'); grd.addColorStop(1,'#c3c7ce');
  g.fillStyle=grd; g.fillRect(0,0,32,512);
  const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}

/* ================= 材质体系 ================= */
const clipPlanes=[];
const partMats={};
function regPart(id,m){
  m.clippingPlanes=clipPlanes; m.clipShadows=true;
  m.userData.baseE={hex:m.emissive?m.emissive.getHex():0,i:m.emissiveIntensity??1};
  (partMats[id]??=[]).push(m); return m;
}
function M(id,params,opts={}){
  const m=new THREE.MeshPhysicalMaterial(Object.assign({side:THREE.DoubleSide},params));
  regPart(id,m); return m;
}
function setHL(id,level){
  const mats=partMats[id]; if(!mats)return;
  mats.forEach(m=>{
    if(!m.emissive)return;
    const b=m.userData.baseE;
    if(level===0){m.emissive.setHex(b.hex);m.emissiveIntensity=b.i;}
    else{m.emissive.setHex(0xff5a1e);m.emissiveIntensity=Math.max(b.i,0)+(level===2?0.30:0.12);}
  });
}

/* ================= 几何工具 ================= */
function loft(secs,ax){
  const S=secs.length,N=secs[0].pts.length;
  const pos=[],uv=[],idx=[];
  secs.forEach((sec,i)=>{
    sec.pts.forEach((p,j)=>{
      if(ax==='x')pos.push(sec.s,p[0],p[1]);
      else pos.push(p[0],p[1],sec.s);
      uv.push(i/(S-1),j/N);
    });
  });
  for(let i=0;i<S-1;i++)for(let j=0;j<N;j++){
    const a=i*N+j,b=i*N+(j+1)%N,c=(i+1)*N+(j+1)%N,d=(i+1)*N+j;
    idx.push(a,b,c,a,c,d);
  }
  function capCenter(si){
    let ca=0,cb=0;
    for(let j=0;j<N;j++){ca+=secs[si].pts[j][0];cb+=secs[si].pts[j][1];}
    if(ax==='x')pos.push(secs[si].s,ca/N,cb/N);
    else pos.push(ca/N,cb/N,secs[si].s);
    uv.push(0.5,0.5);
    return S*N+(si===0?0:1);
  }
  const c0=capCenter(0),c1=capCenter(S-1);
  for(let j=0;j<N;j++){
    idx.push(c0,(j+1)%N,j);
    idx.push(c1,(S-1)*N+j,(S-1)*N+(j+1)%N);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function airfoilPts(chord,tc,n=9){
  const pts=[], t=chord*tc;
  for(let i=0;i<=n;i++){
    const u=i/n;
    const y=t*0.5*Math.pow(Math.sin(Math.PI*u),0.75)-t*0.28*Math.sin(Math.PI*u);
    pts.push([-chord/2+u*chord,y]);
  }
  for(let i=n;i>=0;i--){
    const u=i/n;
    const y=-t*0.30*Math.pow(Math.sin(Math.PI*u),0.9)-t*0.10*Math.sin(Math.PI*u);
    pts.push([-chord/2+u*chord,y]);
  }
  return pts.reverse();   // 翻转绕向:使放样法线朝外(上表面+Y)
}
/* 蒙皮分缝线纹理 */
function skinTexture(w=1024,h=1024){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle='#7e838a'; g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){
    g.fillStyle=`rgba(${Math.random()<0.5?'52,58,66':'175,181,188'},${0.05+Math.random()*0.05})`;
    g.fillRect(Math.random()*w,Math.random()*h,60+Math.random()*240,26+Math.random()*120);
  }
  g.strokeStyle='rgba(56,62,70,0.7)'; g.lineWidth=1.8;
  for(let i=1;i<9;i++){ const y=i*h/9+(Math.random()-0.5)*12;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  for(let k=0;k<3;k++){
    const y0=h*(0.25+Math.random()*0.5);
    g.strokeStyle='rgba(56,62,70,0.75)'; g.lineWidth=1.9;
    g.beginPath();
    let x=Math.random()*w*0.3, y=y0, up=Math.random()<0.5;
    g.moveTo(x,y);
    for(let s=0;s<24;s++){ x+=13+Math.random()*7; y+=up?-8:8; up=!up; g.lineTo(x,y); }
    g.stroke();
  }
  for(let i=0;i<30;i++){
    const pw=40+Math.random()*90, ph=20+Math.random()*44;
    const px=Math.random()*(w-pw), py=Math.random()*(h-ph);
    g.fillStyle=Math.random()<0.5?'rgba(62,68,76,0.08)':'rgba(215,221,228,0.07)';
    g.fillRect(px,py,pw,ph);
    g.strokeStyle='rgba(84,90,98,0.55)'; g.lineWidth=1.4;
    g.strokeRect(px,py,pw,ph);
  }
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=8;
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function turbineTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#1e2124'; g.fillRect(0,0,512,512);
  g.translate(256,256);
  for(let i=0;i<38;i++){
    g.rotate(Math.PI*2/38);
    g.fillStyle=i%2?'#3a3f45':'#31353a';
    g.beginPath(); g.moveTo(0,-8); g.lineTo(240,-30); g.lineTo(240,30); g.lineTo(0,8); g.fill();
  }
  g.fillStyle='#16181b'; g.beginPath(); g.arc(0,0,56,0,7); g.fill();
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=8;
  return tx;
}

/* ================= 对象根组与模块 ================= */
const obj=new THREE.Group(); obj.position.y=2.095; scene.add(obj);   // 地面=平台顶
const pickables=[];
function mesh(geo,mat,parent,part){
  const x=new THREE.Mesh(geo,mat);
  x.castShadow=true;x.receiveShadow=true;
  if(part)x.userData.part=part;
  parent.add(x);pickables.push(x);return x;
}
const MODS={};
function module(key,off){
  const g=new THREE.Group();g.userData.off=off;obj.add(g);MODS[key]=g;return g;

/* ================= 飞翼翼体(展向放样:前缘33°直线+尾缘W折线) ================= */
const NOSE_X=10.5, SWEPT=0.6495;                    // 前缘 33°
const LE=z=>NOSE_X-SWEPT*Math.abs(z);
const TE_PTS=[[0,-10.45],[4.0,-9.3],[6.8,-8.55],[9.8,-9.95],[12.3,-7.95],
              [15.5,-7.0],[20.5,-6.75],[25.2,-7.3],[26.2,-7.55]];
function TE(z){
  const az=Math.abs(z);
  for(let i=0;i<TE_PTS.length-1;i++){
    const [z1,x1]=TE_PTS[i],[z2,x2]=TE_PTS[i+1];
    if(az>=z1&&az<=z2) return lerp(x1,x2,(az-z1)/(z2-z1));
  }
  return -7.55;
}
const T_PTS=[[0,2.30],[4,2.35],[8,2.20],[12,1.65],[16,1.15],[20,0.75],[24,0.42],[26.2,0.12]];
function THK(z){
  const az=Math.abs(z);
  for(let i=0;i<T_PTS.length-1;i++){
    const [z1,t1]=T_PTS[i],[z2,t2]=T_PTS[i+1];
    if(az>=z1&&az<=z2) return lerp(t1,t2,(az-z1)/(z2-z1));
  }
  return 0.12;
}
{
  const ZS=[-26.2,-25.2,-23,-20.5,-15.5,-12.3,-9.8,-8.2,-6.8,-4,-2,0,2,4,6.8,8.2,9.8,12.3,15.5,20.5,23,25.2,26.2];
  const secs=ZS.map(z=>{
    const c=LE(z)-TE(z);
    return {s:z,pts:airfoilPts(c,THK(z)/c)};
  });
  mesh(loft(secs,'z'),mSkin,obj,'skin');
}

function flyTo(pos,target,dur=1.0){
  camTween={t:0,dur,p0:camera.position.clone(),t0:controls.target.clone(),
    p1:V3(...pos),t1:V3(...target)};
}
controls.addEventListener('start',()=>{camTween=null;});
document.querySelectorAll('#grpView .btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#grpView .btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const v=VIEWS[b.dataset.view];flyTo(v[0],v[1]);
  });
});

const cutPlane=[new THREE.Plane(V3(0,0,-1),0)];
function setMode(m){
  state.mode=m;
  document.querySelectorAll('#grpMode .btn').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));
  clipPlanes.length=0;
  if(m==='cut')clipPlanes.push(...cutPlane);
  if(m==='cut')toast('剖面切视:沿纵轴线切开,看乘员舱/弹舱/发动机布局');
}
document.querySelectorAll('#grpMode .btn').forEach(b=>{
  b.addEventListener('click',()=>setMode(b.dataset.mode));
});

function bindToggle(id,key,onTxt,offTxt,fn){
  const el=$(id);
  el.addEventListener('click',()=>{
    state[key]=!state[key];
    el.classList.toggle('on',state[key]);
    if(onTxt)el.textContent=state[key]?onTxt:offTxt;
    fn&&fn(state[key]);
  });
}
bindToggle('tgBay','bay','武器舱 关','武器舱 开',on=>{
  toast(on?'打开武器舱:前后双舱旋转发射架就位':'关闭武器舱,恢复隐身外形');
});
bindToggle('tgGear','gear','起落架 收','起落架 放',on=>{
  toast(on?'收起落架:转入飞行状态':'放起落架:准备着陆');
});
bindToggle('tgSurf','surf');
bindToggle('tgLabels','labels');
bindToggle('tgRotate','rotate',on=>{controls.autoRotate=on;});

const slThr=$('thr');
function paintRange(el){el.style.setProperty('--p',el.value+'%');}
slThr.addEventListener('input',()=>{
  state.thr=+slThr.value/100;paintRange(slThr);
  $('thrOut').textContent=slThr.value+'%';
});
paintRange(slThr);

const infoEl=$('info');
function buildChips(){
  const wrap=$('infoChips');wrap.innerHTML='';
  Object.keys(PARTS).forEach(id=>{
    const c=document.createElement('span');
    c.className='chip';c.dataset.part=id;
    c.textContent=PARTS[id].name;
    c.addEventListener('click',()=>selectPart(id,true));
    wrap.appendChild(c);
  });
}
function renderInfo(partId){
  const P=PARTS[partId];if(!P)return;
  $('infoName').textContent=P.name;
  $('infoEn').textContent=P.en;
  $('infoSpecs').innerHTML=P.specs.map(s=>`<span>${s}</span>`).join('');
  $('infoDesc').textContent=P.desc;
  $('infoTip').style.display=P.tip?'block':'none';
  $('infoTip').textContent=P.tip||'';
  document.querySelectorAll('#infoChips .chip').forEach(c=>
    c.classList.toggle('on',c.dataset.part===partId));
}
function selectPart(partId,fly){
  if(state.selected&&state.selected!==partId)setHL(state.selected,0);
  state.selected=partId;setHL(partId,2);
  renderInfo(partId);
  infoEl.classList.add('show');
  if(fly&&FOCUS[partId])flyTo(FOCUS[partId][0],FOCUS[partId][1],0.9);
}
function deselect(){
  if(state.selected)setHL(state.selected,0);
  state.selected=null;
  infoEl.classList.remove('show');
  document.querySelectorAll('#infoChips .chip').forEach(c=>c.classList.remove('on'));
}
$('btnCloseInfo').addEventListener('click',deselect);
$('btnDeselect').addEventListener('click',deselect);
$('btnFocus').addEventListener('click',()=>{
  if(state.selected&&FOCUS[state.selected])flyTo(FOCUS[state.selected][0],FOCUS[state.selected][1],0.9);
});
buildChips();renderInfo('b2');

const ray=new THREE.Raycaster();const ptr=new THREE.Vector2();
let ptrDown=false,ptrMoved=false;
renderer.domElement.style.cursor='grab';
renderer.domElement.addEventListener('pointerdown',()=>{ptrDown=true;ptrMoved=false;});
renderer.domElement.addEventListener('pointerup',()=>{ptrDown=false;});
renderer.domElement.addEventListener('pointermove',e=>{
  if(ptrDown)ptrMoved=true;
  ptr.x=(e.clientX/innerWidth)*2-1;
  ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  const part=hit?hit.object.userData.part:null;
  if(part!==state.hovered){
    if(state.hovered&&state.hovered!==state.selected)setHL(state.hovered,0);
    state.hovered=part;
    if(part&&part!==state.selected)setHL(part,1);
    renderer.domElement.style.cursor=part?'pointer':'grab';
  }
});
renderer.domElement.addEventListener('click',()=>{
  if(ptrMoved)return;
  if(state.hovered)selectPart(state.hovered,false);
  else deselect();
});
$('hintX').addEventListener('click',()=>$('hint').remove());
setTimeout(()=>{const h=$('hint');if(h){h.style.opacity='0';h.style.transition='opacity 1s';setTimeout(()=>h.remove(),1000);}},14000);

/* ================= 标注 ================= */
const LABEL_DEFS=[
  ['radome','雷达罩','radome',[9.6,0.5,0]],
  ['cockpit','座舱 · 双人机组','cockpit',[8.3,1.5,0]],
  ['intake','背部 S 弯进气道','intake',[4.2,1.35,2.1]],
  ['engine','F118 ×4','engine',[1.5,0.5,2.2]],
  ['exhaust','二维窄缝排气','exhaust',[-9.4,1.15,2.1]],
  ['wing','飞翼翼体','wing',[9,0.3,-12]],
  ['elevon','升降副翼','elevon',[-6.6,0.35,-17]],
  ['rudd','开裂式阻力方向舵','rudd',[-7,0.5,-25.3]],
  ['bay','内置弹舱','bay',[5.0,-1.3,0.7]],
  ['gear','起落架','gear',[-1.55,-3.4,2.3]],
];
const labelAnchors=[];
{
  const wrap=$('labels');
  LABEL_DEFS.forEach(([part,text,modKey,p])=>{
    const anchor=new THREE.Object3D();anchor.position.set(...p);
    obj.add(anchor);
    const el=document.createElement('div');
    el.className='lab';el.textContent=text;
    el.addEventListener('click',()=>selectPart(part,true));
    wrap.appendChild(el);
    labelAnchors.push({part,anchor,el});
  });
}
const _lv=new THREE.Vector3();
function updateLabels(){
  labelAnchors.forEach(L=>{
    L.anchor.getWorldPosition(_lv);_lv.project(camera);
    const off=_lv.z>1||_lv.z<-1;
    const vis=state.labels&&!off;
    L.el.style.display=vis?'block':'none';
    if(!vis)return;
    L.el.style.left=((_lv.x*0.5+0.5)*innerWidth)+'px';
    L.el.style.top=((-_lv.y*0.5+0.5)*innerHeight)+'px';
    L.el.classList.toggle('on',state.selected===L.part);
    L.el.classList.toggle('dim',!!state.selected&&state.selected!==L.part);
  });
}

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let booted=false;

function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  /* 画布自愈 */
  if(renderer.domElement.width<2){
    const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
    camera.aspect=w/h;camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }

  state.bayT+=((state.bay?1:0)-state.bayT)*Math.min(1,dt*2.0);
  state.gearT+=((state.gear?1:0)-state.gearT)*Math.min(1,dt*1.2);
  state.thrT+=(state.thr-state.thrT)*Math.min(1,dt*1.5);
  const thr=state.thrT;

  /* 舱门 */
  bayDoors.forEach(({pivot,sgn})=>{ pivot.rotation.x=sgn*state.bayT*95*D2R; });
  launchers.forEach(d=>{ d.rotation.x=state.bayT*0; });
  /* 起落架 */
  gearPivots.forEach(({p,fold})=>{
    p.rotation.z=fold*(1-state.gearT);
    p.visible=state.gearT>0.02;
  });
  /* 舵面演示 */
  const wig=state.surf?1:0;
  elevons.forEach((e,i)=>{
    e.surf.rotation.x=lerp(e.surf.rotation.x,
      Math.sin(t*1.6+i*0.9)*18*D2R*wig,0.1);
  });
  ruddHalves.forEach(({up,lo,sgn},i)=>{
    const open=(Math.sin(t*1.1)*0.5+0.5)*wig;
    up.rotation.x=lerp(up.rotation.x,-open*26*D2R,0.1);
    lo.rotation.x=lerp(lo.rotation.x,open*26*D2R,0.1);
  });

  /* 发动机:风扇旋转 + 排气辉光 + 喷口微红 */
  fanDisks.forEach((f,i)=>{ f.rotation.y+=dt*(2+thr*40)*(i%2?1:-1); });
  exhGlows.forEach(m=>{ m.opacity=thr*0.45; });
  mNoz.emissiveIntensity=thr*0.5;

  /* 相机补间 */
  if(camTween){
    camTween.t+=dt/camTween.dur;
    const k=camTween.t>=1?1:(camTween.t<0.5?4*camTween.t**3:1-Math.pow(-2*camTween.t+2,3)/2);
    camera.position.lerpVectors(camTween.p0,camTween.p1,k);
    controls.target.lerpVectors(camTween.t0,camTween.t1,k);
    if(camTween.t>=1)camTween=null;
  }
  controls.update();
  updateLabels();

  hudTimer+=dt;
  if(hudTimer>0.15){
    hudTimer=0;
    $('thrv').textContent=(308*thr).toFixed(0);
    $('modev').textContent=state.gear?'地面':'空中';
  }

  renderer.render(scene,camera);

  if(!booted){
    booted=true;
    setTimeout(()=>{$('boot').classList.add('hide');
      setTimeout(()=>flyTo(VIEWS.hero[0],VIEWS.hero[1],1.6),80);},350);
  }
}
let hudTimer=0;

/* ================= 启动 ================= */
renderer.setAnimationLoop(loop);
window.__step=n=>{for(let i=0;i<n;i++)loop();};
window.__shot=()=>renderer.domElement.toDataURL('image/png');
window.__view=(p,t)=>{camera.position.set(...p);controls.target.set(...t);camTween=null;};
window.__set=k=>{Object.assign(state,k);};
window.__dbg={scene,renderer,camera,controls,obj,state};
</script>

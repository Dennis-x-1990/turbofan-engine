<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const D2R=Math.PI/180;

const state={ mode:'full', labels:true, rotate:false,
  rotor:false, door:false, ramp:false, surf:false,
  omega:0, doorT:0, rampT:0,
  selected:null, hovered:null };

/* ================= 渲染基础 ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(Math.max(320,innerWidth||1500),Math.max(240,innerHeight||900));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
renderer.localClippingEnabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=makeBackgroundTexture();

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
camera.position.set(-22,9,-21);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=5; controls.maxDistance=110;
controls.maxPolarAngle=1.52;
controls.target.set(1.5,2.2,0);
controls.autoRotateSpeed=0.8;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

scene.add(new THREE.HemisphereLight(0xe3e9f2,0xc8ccd2,0.7));
const key=new THREE.DirectionalLight(0xfff3e6,2.2);
key.position.set(14,26,-14);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-24; key.shadow.camera.right=24;
key.shadow.camera.top=20;   key.shadow.camera.bottom=-14;
key.shadow.camera.near=1;   key.shadow.camera.far=90;
key.shadow.radius=6; key.shadow.bias=-0.0004;
scene.add(key);
const rim=new THREE.DirectionalLight(0xd8e6ff,1.2);
rim.position.set(-20,10,18); scene.add(rim);
const front=new THREE.DirectionalLight(0xfff0dd,0.7);
front.position.set(-10,5,-20); scene.add(front);
const fill=new THREE.DirectionalLight(0xffffff,0.22);
fill.position.set(0,-8,12); scene.add(fill);

/* 摄影台 */
{
  const cat=new THREE.Mesh(new THREE.CircleGeometry(34,80),new THREE.ShadowMaterial({opacity:0.22}));
  cat.rotation.x=-Math.PI/2; cat.position.y=-1.94; cat.receiveShadow=true; scene.add(cat);
  const plat=new THREE.Mesh(new THREE.CylinderGeometry(24,25,0.24,96),
    new THREE.MeshStandardMaterial({color:0x83888f,roughness:1.0,metalness:0.04,envMapIntensity:0.3}));
  plat.position.y=-2.07; plat.receiveShadow=true; scene.add(plat);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(24.1,0.025,8,140),
    new THREE.MeshBasicMaterial({color:0xb9bec7}));
  ring.rotation.x=Math.PI/2; ring.position.y=-1.925; scene.add(ring);
}

addEventListener('resize',()=>{
  const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

function makeBackgroundTexture(){
  const c=document.createElement('canvas'); c.width=32; c.height=512;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,512);
  grd.addColorStop(0,'#eef0f4'); grd.addColorStop(0.55,'#e2e5ea'); grd.addColorStop(1,'#c3c7ce');
  g.fillStyle=grd; g.fillRect(0,0,32,512);
  const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}

/* ================= 程序化纹理(军绿蒙皮) ================= */
function skinTexture(w=1024,h=512,base='#4d5244'){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<44;i++){
    g.fillStyle=`rgba(${Math.random()<0.5?'34,38,28':'120,126,108'},${0.04+Math.random()*0.05})`;
    g.fillRect(Math.random()*w,Math.random()*h,60+Math.random()*240,26+Math.random()*110);
  }
  const line=(x1,y1,x2,y2,a=0.5,lw=1.5)=>{
    g.strokeStyle=`rgba(30,34,24,${a})`; g.lineWidth=lw;
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  };
  for(let i=1;i<7;i++){ const y=i*h/7+(Math.random()-0.5)*14; line(0,y,w,y,0.55); }
  for(let i=1;i<6;i++){ const x=i*w/6+(Math.random()-0.5)*16; line(x,0,x,h,0.45); }
  for(let i=0;i<26;i++){
    const pw=40+Math.random()*90, ph=18+Math.random()*44;
    const px=Math.random()*(w-pw), py=Math.random()*(h-ph);
    g.fillStyle=Math.random()<0.5?'rgba(34,38,28,0.10)':'rgba(118,124,104,0.09)';
    g.fillRect(px,py,pw,ph);
    g.strokeStyle='rgba(40,44,32,0.6)'; g.lineWidth=1.4;
    g.strokeRect(px,py,pw,ph);
  }
  // 检修口盖小圆点排
  for(let i=0;i<5;i++){
    const y=Math.random()*h;
    g.fillStyle='rgba(32,36,26,0.5)';
    for(let x=10;x<w-10;x+=12) g.fillRect(x,y,1.6,1.6);
  }
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=8;
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function blurDiscTexture(){
  const c=document.createElement('canvas'); c.width=512; c.height=512;
  const g=c.getContext('2d');
  g.translate(256,256);
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2, r=90+Math.random()*166;
    g.strokeStyle=`rgba(60,64,58,${0.05+Math.random()*0.1})`;
    g.lineWidth=2+Math.random()*3;
    g.beginPath();
    g.ellipse(Math.cos(a)*r*0.6,Math.sin(a)*r*0.6,r*0.5,7,a,0,Math.PI*2);
    g.stroke();
  }
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}

/* ================= 材质体系 ================= */
const clipPlanes=[];
const partMats={};
function regPart(id,m){
  m.clippingPlanes=clipPlanes; m.clipShadows=true;
  m.userData.baseE={hex:m.emissive?m.emissive.getHex():0,i:m.emissiveIntensity??1};
  (partMats[id]??=[]).push(m); return m;
}
function M(id,params,opts={}){
  const m=new THREE.MeshPhysicalMaterial(Object.assign({side:THREE.DoubleSide},params));
  regPart(id,m); return m;
}
function setHL(id,level){
  const mats=partMats[id]; if(!mats)return;
  mats.forEach(m=>{
    if(!m.emissive)return;
    const b=m.userData.baseE;
    if(level===0){m.emissive.setHex(b.hex);m.emissiveIntensity=b.i;}
    else{m.emissive.setHex(0xff5a1e);m.emissiveIntensity=Math.max(b.i,0)+(level===2?0.30:0.12);}
  });
}

const fuseTex=skinTexture(1024,512);
const mFuse = M('fuselage',{color:0xffffff,map:fuseTex,metalness:0.12,roughness:0.6,
  bumpMap:fuseTex,bumpScale:0.4,envMapIntensity:1.15});
const mFuseD= M('fuselage',{color:0x484d40,metalness:0.12,roughness:0.64,
  bumpMap:fuseTex,bumpScale:0.4,envMapIntensity:1.1});
const mBlade= M('rotor',{color:0x5c6250,metalness:0.15,roughness:0.5});
const mBladeTip=M('rotor',{color:0xe8eaec,metalness:0.2,roughness:0.4});
const mHub  = M('rotor',{color:0x555a52,metalness:0.6,roughness:0.45});
const mOil  = M('rotor',{color:0x3a3e36,metalness:0.5,roughness:0.5});
const mGlass= M('cockpit',{color:0x2a3128,metalness:0.85,roughness:0.1,
  transparent:true,opacity:0.72,clearcoat:1.0,clearcoatRoughness:0.06,envMapIntensity:1.6});
const mEng  = M('engine',{color:0x50544a,metalness:0.5,roughness:0.5});
const mDark = M('engine',{color:0x1e2124,metalness:0.4,roughness:0.65});
const mExh  = M('engine',{color:0x443f38,metalness:0.75,roughness:0.5,
  emissive:0x442200,emissiveIntensity:0});
const mTank = M('esss',{color:0x9aa084,metalness:0.15,roughness:0.5,map:fuseTex});
const mTire = M('gear',{color:0x24262a,metalness:0.2,roughness:0.85});
const mStrut= M('gear',{color:0x6a6f62,metalness:0.5,roughness:0.45});
const mSeat = M('cabin',{color:0x3a3e34,metalness:0.2,roughness:0.75});

/* ================= 几何工具 ================= */
function loft(secs,ax){
  const S=secs.length,N=secs[0].pts.length;
  const pos=[],uv=[],idx=[];
  secs.forEach((sec,i)=>{
    sec.pts.forEach((p,j)=>{
      if(ax==='x')pos.push(sec.s,p[0],p[1]);
      else if(ax==='y')pos.push(p[0],sec.s,p[1]);
      else pos.push(p[0],p[1],sec.s);
      uv.push(i/(S-1),j/N);
    });
  });
  for(let i=0;i<S-1;i++)for(let j=0;j<N;j++){
    const a=i*N+j,b=i*N+(j+1)%N,c=(i+1)*N+(j+1)%N,d=(i+1)*N+j;
    idx.push(a,b,c,a,c,d);
  }
  function capCenter(si){
    let ca=0,cb=0;
    for(let j=0;j<N;j++){ca+=secs[si].pts[j][0];cb+=secs[si].pts[j][1];}
    if(ax==='x')pos.push(secs[si].s,ca/N,cb/N);
    else if(ax==='y')pos.push(ca/N,secs[si].s,cb/N);
    else pos.push(ca/N,cb/N,secs[si].s);
    uv.push(0.5,0.5);
    return S*N+(si===0?0:1);
  }
  const c0=capCenter(0),c1=capCenter(S-1);
  for(let j=0;j<N;j++){
    idx.push(c0,(j+1)%N,j);
    idx.push(c1,(S-1)*N+j,(S-1)*N+(j+1)%N);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
/* 圆角矩形截面(机身):nT 顶部圆度,nB 底部扁平度 */
function rsect(w,yb,yt,nT=2.2,nB=3.0,N=44){
  const cy=(yb+yt)/2, ry=(yt-yb)/2, pts=[];
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2, s=Math.sin(a), c=Math.cos(a);
    const tn=s>=0?nT:nB;
    const y=cy+ry*Math.sign(s)*Math.pow(Math.abs(s),2/tn);
    const z=w*Math.sign(c)*Math.pow(Math.abs(c),2/2.2);
    pts.push([y,z]);
  }
  return pts;
}
function airfoilPts(chord,tc,n=9){
  const pts=[], t=chord*tc;
  for(let i=0;i<=n;i++){
    const u=i/n;
    const y=t*0.5*Math.pow(Math.sin(Math.PI*u),0.75)-0.08*t*Math.sin(Math.PI*u)+0.10*t*u;
    pts.push([-chord/2+u*chord,y]);
  }
  for(let i=n;i>=0;i--){
    const u=i/n;
    const y=-t*0.32*Math.pow(Math.sin(Math.PI*u),0.9)-0.04*t*Math.sin(Math.PI*u)-0.08*t*u;
    pts.push([-chord/2+u*chord,y]);
  }
  return pts;
}

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let hudTimer=0,booted=false;
const W_MAX=27;                       // 主旋翼角速度 rad/s (~258rpm)

function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  /* 画布自愈 */
  if(renderer.domElement.width<2){
    const w=Math.max(320,innerWidth||1500),h=Math.max(240,innerHeight||900);
    camera.aspect=w/h;camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }

  /* 旋翼惯性 */
  const wTgt=state.rotor?W_MAX:0;
  state.omega+=(wTgt-state.omega)*Math.min(1,dt*(state.rotor?0.55:0.4));
  const wn=clamp(state.omega/W_MAX,0,1);
  rotorSpin.rotation.y+=state.omega*dt;
  tailSpin.rotation.z+=state.omega*0.32*dt;   // 尾桨转速更高(实际转速~1000+rpm)

  /* 桨叶锥角/下垂 */
  const flapT=lerp(-2.2,2.8,wn)*D2R;
  flapGroups.forEach(f=>{ f.rotation.z=lerp(f.rotation.z,flapT,0.06); });
  rotorRoot.userData.disc.material.opacity=0.22*wn;

  /* 舱门/货桥 */
  state.doorT+=((state.door?1:0)-state.doorT)*Math.min(1,dt*2);
  doorPanels.forEach(({d,dw,sgn})=>{
    d.position.x=2.1+state.doorT*1.15;
    dw.position.x=2.55+state.doorT*1.15;
  });
  state.rampT+=((state.ramp?1:0)-state.rampT)*Math.min(1,dt*1.5);
  rampPivot.rotation.z=state.rampT*72*D2R;

  /* 舵面演示 */
  const wig=state.surf?1:0;
  stabGroup.rotation.x=lerp(stabGroup.rotation.x,Math.sin(t*1.4)*7*D2R*wig,0.08);
  /* 排气辉光 */
  exhGlows.forEach(m=>{ m.opacity=0.5*wn; });
  mExh.emissiveIntensity=0.6*wn;

  /* 相机补间 */
  if(camTween){
    camTween.t+=dt/camTween.dur;
    const k=camTween.t>=1?1:(camTween.t<0.5?4*camTween.t**3:1-Math.pow(-2*camTween.t+2,3)/2);
    camera.position.lerpVectors(camTween.p0,camTween.p1,k);
    controls.target.lerpVectors(camTween.t0,camTween.t1,k);
    if(camTween.t>=1)camTween=null;
  }
  controls.update();
  updateLabels();

  hudTimer+=dt;
  if(hudTimer>0.15){
    hudTimer=0;
    $('rpmv').textContent=Math.round(wn*100);
    $('modev').textContent=wn>0.95?(state.rotor?'飞行':'地转'):(wn>0.03?'启动':'停车');
  }

  renderer.render(scene,camera);

  if(!booted){
    booted=true;
    setTimeout(()=>{$('boot').classList.add('hide');
      setTimeout(()=>flyTo(VIEWS.hero[0],VIEWS.hero[1],1.6),80);},350);
  }
}

/* ================= 启动 ================= */
renderer.setAnimationLoop(loop);
window.__step=n=>{for(let i=0;i<n;i++)loop();};
window.__shot=()=>renderer.domElement.toDataURL('image/png');
window.__view=(p,t)=>{camera.position.set(...p);controls.target.set(...t);camTween=null;};
window.__set=k=>{Object.assign(state,k);};
window.__dbg={scene,renderer,camera,controls,obj,state};
</script>
</body>
</html>
